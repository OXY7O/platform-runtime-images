name: Release Runtime Images

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: runtime-image-release-php-83
  cancel-in-progress: false

jobs:
  release-php-83:
    environment: runtime-image-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/oxy7o/platform-ci-php
      REQUESTED_RELEASE: ${{ github.ref_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Require a commit from main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify signed annotated release tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const name = context.ref.replace("refs/tags/", "");
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${name}`,
            });
            if (ref.data.object.type !== "tag") {
              core.setFailed("Release tag must be annotated and signed.");
              return;
            }
            const tag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: ref.data.object.sha,
            });
            if (!tag.data.verification?.verified || tag.data.object.sha !== context.sha) {
              core.setFailed("Release tag signature or target is not verified.");
            }

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          release_version="${REQUESTED_RELEASE#v}"
          if [[ ! "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release must use stable Semantic Versioning X.Y.Z." >&2
            exit 1
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Validate repository contracts
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            node:24-bookworm@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0 \
            sh -c 'npm ci --ignore-scripts && npm test && npm run validate:catalogue && npm audit --audit-level=moderate'

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing release version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const releaseTag = "php-8.3-${{ steps.release.outputs.version }}";
            let versions = [];
            try {
              versions = await github.paginate(
                github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
                {
                  package_type: "container",
                  package_name: "platform-ci-php",
                  org: context.repo.owner,
                  per_page: 100,
                },
              );
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const exists = versions.some((version) =>
              version.metadata?.container?.tags?.includes(releaseTag),
            );
            if (exists) {
              core.setFailed(`Release version already exists and cannot be overwritten: ${releaseTag}`);
            }

      - name: Build and publish controlled image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: images/php-ci
          file: images/php-ci/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:php-8.3-${{ steps.release.outputs.version }}
          build-args: |
            PHP_BASE_IMAGE=php:8.3-cli-bookworm@sha256:177529735599a8244b2c903522f029839dce1c2ac4be122fdc00ada4b45a20e4
            SOURCE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.release.outputs.version }}
          provenance: false

      - name: Resolve and pull published digest
        run: |
          if [[ ! "${{ steps.build.outputs.digest }}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Build did not return an immutable digest." >&2
            exit 1
          fi
          echo "IMAGE_REF=${IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
          echo "SIGNATURE_IDENTITY=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" >> "$GITHUB_ENV"
          docker pull "${IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}"

      - name: Verify published image by digest
        run: scripts/verify-image.sh "$IMAGE_REF"

      - name: Generate SPDX SBOM
        run: |
          mkdir -p reports
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
            "$IMAGE_REF" -o spdx-json > reports/sbom.spdx.json

      - name: Scan published image
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/reports:/reports" \
            aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
            image --format json --output /reports/trivy.json "$IMAGE_REF"

      - name: Enforce vulnerability policy
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            node:24-bookworm@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0 \
            node scripts/evaluate-vulnerabilities.mjs reports/trivy.json policies/vulnerability-policy.json php-ci/8.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign published image
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify published signature
        run: |
          cosign verify \
            --certificate-identity "$SIGNATURE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create catalogue update candidate
        run: |
          node scripts/record-release.mjs \
            catalogue/php-ci.json \
            reports/php-ci.catalogue.candidate.json \
            php-ci/8.3 \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.build.outputs.digest }}"

      - name: Record release evidence
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" reports/provenance.bundle.jsonl
          sbom_sha="$(sha256sum reports/sbom.spdx.json | cut -d ' ' -f1)"
          node scripts/create-release-evidence.mjs \
            reports/release-evidence.json \
            php-ci/8.3 \
            "${{ steps.release.outputs.version }}" \
            "${{ github.sha }}" \
            "$IMAGE_REF" \
            "${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$SIGNATURE_IDENTITY" \
            "${{ steps.attest.outputs.attestation-id }}" \
            "${{ steps.attest.outputs.attestation-url }}" \
            "$sbom_sha"

      - name: Upload non-secret release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-image-release-${{ steps.release.outputs.version }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn

  publish-github-release:
    needs: [release-php-83]
    environment: runtime-image-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish immutable GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const version = "${{ needs.release-php-83.outputs.version }}";
            const digest = "${{ needs.release-php-83.outputs.digest }}";
            const expectedRef = `refs/tags/v${version}`;
            if (context.ref !== expectedRef || !/^sha256:[a-f0-9]{64}$/.test(digest)) {
              core.setFailed("Release identity or published digest is invalid.");
              return;
            }
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              target_commitish: context.sha,
              name: `Platform Runtime Images v${version}`,
              body: [
                `Immutable PHP CI image release \`v${version}\`.`,
                "",
                `- Image: \`ghcr.io/oxy7o/platform-ci-php@${digest}\``,
                `- Source commit: \`${context.sha}\``,
                `- Evidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n"),
              draft: false,
              prerelease: false,
            });
